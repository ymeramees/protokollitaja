---
#---------------------------------#
#      general configuration      #
#---------------------------------#

# version format
version: 0.9.3-test-{build}

# branches to build
branches:
  # whitelist
  only:
    - devel

# Start builds on tags only (GitHub, BitBucket, GitLab, Gitea)
skip_non_tags: false

# Maximum number of concurrent jobs for the project
max_jobs: 1

image:
  - Visual Studio 2022
  - Ubuntu
  - macos

for:
  #---------------------------------#
  #         Windows Build           #
  #---------------------------------#
  - matrix:
      only:
        - image: Visual Studio 2022

    clone_folder: C:\projects\protokollitaja

    install:
      - cmd: >-
          set QTDIR=C:\Qt\6.9\mingw_64

          set OPENSSL_INCLUDE_PATH=C:\OpenSSL-v30-Win64\include\openssl

          set OPENSSL_LIB_PATH=C:\OpenSSL-v30-Win64\lib\MinGW

          echo %PATH:;=&echo.%

          ls C:\Qt

          ls C:\Qt\6.9

          ls C:\Qt\mingw_64\Tools

          ls C:\Qt\mingw_64\Tools\mingw1310_64\bin

          ls C:\Qt\6.9

          ls %QTDIR%

          ls %QTDIR%\bin

          type %QTDIR%\bin\qtenv2.bat

          %QTDIR%\bin\qtenv2.bat

          set PATH=%PATH%;C:\Qt\mingw_64\Tools\mingw1310_64\bin

          qmake -v

          set make=mingw32-make.exe

          g++ --version

          %make% --version

    build_script:
      - cmd: >-
          cd %APPVEYOR_BUILD_FOLDER%

          dir

          cmake -DCMAKE_PREFIX_PATH:PATH=C:\Qt\6.9\mingw_64 -DCMAKE_C_COMPILER=C:\Qt\mingw_64\Tools\mingw1310_64\bin\gcc.exe -DCMAKE_CXX_COMPILER=C:\Qt\mingw_64\Tools\mingw1310_64\bin\g++.exe -G "MinGW Makefiles" -S %APPVEYOR_BUILD_FOLDER% -B %APPVEYOR_BUILD_FOLDER%\build

          cmake --build %APPVEYOR_BUILD_FOLDER%\build

    test_script:
      - ps: >-
          echo $env:APPVEYOR_BUILD_FOLDER

          cd $env:APPVEYOR_BUILD_FOLDER

          dir

          New-Item -Path .\build -Name "Protokollitaja-$env:APPVEYOR_BUILD_VERSION" -ItemType "directory"

          New-Item -Path ".\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION" -Name "Data" -ItemType "directory"

          New-Item -Path ".\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION" -Name "tools" -ItemType "directory"

          $apps = Get-ChildItem -Path "$env:APPVEYOR_BUILD_FOLDER" -Recurse -Name -Include *.exe -Exclude *test.exe

          echo $apps

          foreach($app in $apps) {

              Copy-Item "$app" -Destination "$env:APPVEYOR_BUILD_FOLDER\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION"

          }

          Copy-Item "$env:APPVEYOR_BUILD_FOLDER\protokollitaja\build\release\Data\Print_template.html" -Destination "$env:APPVEYOR_BUILD_FOLDER\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION\Data"

          Copy-Item "C:\Qt\mingw_64\Tools\mingw1310_64\bin\addr2line.exe" -Destination "$env:APPVEYOR_BUILD_FOLDER\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION\tools"

          Copy-Item "$env:APPVEYOR_BUILD_FOLDER\Release-Notes.md" -Destination "$env:APPVEYOR_BUILD_FOLDER\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION"

          cd .\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION

          $copiedApps = Get-ChildItem -Path . -Name -Include *.exe

          echo $copiedApps

          foreach($app in $copiedApps) {

              windeployqt6.exe $app

          }

          dir

          cd $env:APPVEYOR_BUILD_FOLDER

          & 7z a "Protokollitaja-$env:APPVEYOR_BUILD_VERSION.zip" ".\build\Protokollitaja-$env:APPVEYOR_BUILD_VERSION"

          $tests = Get-ChildItem -Path $env:APPVEYOR_BUILD_FOLDER -Recurse -Name -Include *test.exe

          foreach($test in $tests) {

              echo Testing: $test

              if ($test.IndexOf("IntegrationTest") -lt 0) {

                  & $test -junitxml -tickcounter -o testresults.xml

                  $wc = New-Object 'System.Net.WebClient'

                  $wc.UploadFile("https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)", (Resolve-Path .\testresults.xml))

              }

          }

    artifacts:
      - path: "*.zip"
        name: Protokollitaja-Windows

  #---------------------------------#
  #         Linux Build             #
  #---------------------------------#
  - matrix:
      only:
        - image: Ubuntu

    install:
      - sh: >-
          sudo apt-get update

          sudo apt-get install -y build-essential ninja-build qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6serialport6-dev libqt6sql6-sqlite libgl1-mesa-dev libglu1-mesa-dev python3-pip

          sudo pip3 install cmake --upgrade

          export PATH="$HOME/.local/bin:$PATH"

          qmake6 -v || true

          cmake --version

          g++ --version

    build_script:
      - sh: >-
          cd $APPVEYOR_BUILD_FOLDER

          export PATH="$HOME/.local/bin:$PATH"

          ls -la

          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -S $APPVEYOR_BUILD_FOLDER -B $APPVEYOR_BUILD_FOLDER/build

          cmake --build $APPVEYOR_BUILD_FOLDER/build

    test_script:
      - sh: >-
          cd $APPVEYOR_BUILD_FOLDER

          mkdir -p build/Protokollitaja-$APPVEYOR_BUILD_VERSION

          mkdir -p build/Protokollitaja-$APPVEYOR_BUILD_VERSION/Data

          find build -type f -executable ! -name "*test*" -exec cp {} build/Protokollitaja-$APPVEYOR_BUILD_VERSION/ \; 2>/dev/null || true

          if [ -f "protokollitaja/build/release/Data/Print_template.html" ]; then
            cp protokollitaja/build/release/Data/Print_template.html build/Protokollitaja-$APPVEYOR_BUILD_VERSION/Data/
          fi

          cp Release-Notes.md build/Protokollitaja-$APPVEYOR_BUILD_VERSION/ 2>/dev/null || true

          cd build

          tar -czf Protokollitaja-$APPVEYOR_BUILD_VERSION.tar.gz Protokollitaja-$APPVEYOR_BUILD_VERSION

          cd $APPVEYOR_BUILD_FOLDER

          find build -type f -name "*test*" -executable | while read test; do
            echo "Testing: $test"
            if [[ "$test" != *"IntegrationTest"* ]]; then
              $test -junitxml -tickcounter -o testresults.xml || true
            fi
          done

    artifacts:
      - path: "build/*.tar.gz"
        name: Protokollitaja-Linux

  #---------------------------------#
  #         macOS Build             #
  #---------------------------------#
  - matrix:
      only:
        - image: macos

    install:
      - sh: >-
          brew install qt@6 cmake

          export Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6

          export PATH="$(brew --prefix qt@6)/bin:$PATH"

          echo "Qt6_DIR=$Qt6_DIR"

          ls -la $(brew --prefix qt@6)/lib/cmake/ || true

          qmake -v || true

          cmake --version

          clang++ --version

    build_script:
      - sh: >-
          cd $APPVEYOR_BUILD_FOLDER

          ls -la

          export PATH="$(brew --prefix qt@6)/bin:$PATH"

          export Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6

          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) -S $APPVEYOR_BUILD_FOLDER -B $APPVEYOR_BUILD_FOLDER/build

          cmake --build $APPVEYOR_BUILD_FOLDER/build

    test_script:
      - sh: >-
          cd $APPVEYOR_BUILD_FOLDER

          export PATH="$(brew --prefix qt@6)/bin:$PATH"

          mkdir -p build/Protokollitaja-$APPVEYOR_BUILD_VERSION

          mkdir -p build/Protokollitaja-$APPVEYOR_BUILD_VERSION/Data

          find build -type f -perm +111 ! -name "*test*" -exec cp {} build/Protokollitaja-$APPVEYOR_BUILD_VERSION/ \; 2>/dev/null || true

          if [ -f "protokollitaja/build/release/Data/Print_template.html" ]; then
            cp protokollitaja/build/release/Data/Print_template.html build/Protokollitaja-$APPVEYOR_BUILD_VERSION/Data/
          fi

          cp Release-Notes.md build/Protokollitaja-$APPVEYOR_BUILD_VERSION/ 2>/dev/null || true

          cd build/Protokollitaja-$APPVEYOR_BUILD_VERSION

          for app in protokollitaja protolehelugeja protofinaal rangecontrol; do
            if [ -f "$app" ]; then
              macdeployqt "$app" || true
            fi
          done

          cd ..

          tar -czf Protokollitaja-$APPVEYOR_BUILD_VERSION.tar.gz Protokollitaja-$APPVEYOR_BUILD_VERSION

          cd $APPVEYOR_BUILD_FOLDER

          find build -type f -perm +111 -name "*test*" | while read test; do
            echo "Testing: $test"
            if [[ "$test" != *"IntegrationTest"* ]]; then
              $test -junitxml -tickcounter -o testresults.xml || true
            fi
          done

    artifacts:
      - path: "build/*.tar.gz"
        name: Protokollitaja-macOS
notifications:
  - provider: Email
    to:
      - ymeramees@gmail.com
    subject: Protokollitaja-dev Build {{status}}
    message: "'{{message}}, {{commitId}}, ...'"
    on_build_success: false
    on_build_failure: false
    on_build_status_changed: true
