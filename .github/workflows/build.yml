name: Build

on:
  push:
    branches:
      - feature/macos-and-linux-builds
  pull_request:
    branches:
      - feature/macos-and-linux-builds

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          # Check Qt installation
          Write-Host "Qt6_DIR environment variable: $env:Qt6_DIR"
          Write-Host "Searching for Qt installation..."

          # Try to find Qt directory
          $qtPath = $null
          if ($env:Qt6_DIR -and (Test-Path $env:Qt6_DIR)) {
            $qtPath = $env:Qt6_DIR
          } else {
            # Search for Qt in common locations
            $possiblePaths = @(
              "D:\a\protokollitaja\protokollitaja\Qt\6.9*\mingw_64",
              "D:\a\protokollitaja\Qt\6.9*\mingw_64",
              "C:\Qt\6.9*\mingw_64"
            )
            foreach ($pattern in $possiblePaths) {
              $found = Get-Item $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $qtPath = $found.FullName
                break
              }
            }
          }

          if (-not $qtPath) {
            Write-Error "Qt installation not found"
            exit 1
          }

          Write-Host "Found Qt at: $qtPath"
          $env:CMAKE_PREFIX_PATH = $qtPath

          # Find MinGW
          $qtRoot = Split-Path (Split-Path $qtPath)
          $toolsDir = Join-Path $qtRoot "Tools"
          Write-Host "Looking for MinGW in: $toolsDir"

          $mingwBinPath = $null
          $gccPath = $null
          $gxxPath = $null

          if (Test-Path $toolsDir) {
            $mingwPath = Get-ChildItem -Path $toolsDir -Directory -Filter "mingw*" | Select-Object -First 1
            if ($mingwPath) {
              $mingwBinPath = Join-Path $mingwPath.FullName "bin"
              $gccPath = Join-Path $mingwBinPath "gcc.exe"
              $gxxPath = Join-Path $mingwBinPath "g++.exe"

              if ((Test-Path $gccPath) -and (Test-Path $gxxPath)) {
                $env:PATH = "$mingwBinPath;$env:PATH"
                Write-Host "Added MinGW to PATH: $mingwBinPath"
                Write-Host "Using GCC: $gccPath"
                Write-Host "Using G++: $gxxPath"
              } else {
                Write-Host "WARNING: MinGW compilers not found at expected location"
                $gccPath = $null
                $gxxPath = $null
              }
            }
          }

          # Build cmake command
          $cmakeArgs = @(
            "-G", "MinGW Makefiles",
            "-DCMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH",
            "-DCMAKE_BUILD_TYPE=Release",
            "-S", ".",
            "-B", "build"
          )

          if ($gccPath -and $gxxPath) {
            $cmakeArgs += "-DCMAKE_C_COMPILER=$gccPath"
            $cmakeArgs += "-DCMAKE_CXX_COMPILER=$gxxPath"
          }

          Write-Host "Running CMake with args: $($cmakeArgs -join ' ')"
          & cmake @cmakeArgs

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Package application
        run: |
          New-Item -Path .\build -Name "Protokollitaja-Windows" -ItemType "directory" -Force
          New-Item -Path ".\build\Protokollitaja-Windows" -Name "Data" -ItemType "directory" -Force
          New-Item -Path ".\build\Protokollitaja-Windows" -Name "tools" -ItemType "directory" -Force

          $apps = Get-ChildItem -Path ".\build" -Recurse -Name -Include *.exe -Exclude *test.exe
          foreach($app in $apps) {
            if (Test-Path ".\build\$app") {
              Copy-Item ".\build\$app" -Destination ".\build\Protokollitaja-Windows"
            }
          }

          if (Test-Path ".\protokollitaja\build\release\Data\Print_template.html") {
            Copy-Item ".\protokollitaja\build\release\Data\Print_template.html" -Destination ".\build\Protokollitaja-Windows\Data"
          }

          Copy-Item ".\Release-Notes.md" -Destination ".\build\Protokollitaja-Windows" -ErrorAction SilentlyContinue

          cd .\build\Protokollitaja-Windows
          $copiedApps = Get-ChildItem -Path . -Name -Include *.exe
          foreach($app in $copiedApps) {
            windeployqt $app
          }

      - name: Create archive
        run: |
          Compress-Archive -Path ".\build\Protokollitaja-Windows" -DestinationPath "Protokollitaja-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-Windows
          path: Protokollitaja-Windows.zip
          retention-days: 30

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "linux"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Ninja" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          echo "Looking for test executables..."
          find . -name "*est*" -type f -executable || true
          echo "Running CTest..."
          ctest --output-on-failure -C Release --verbose || echo "No tests found or tests failed"
        continue-on-error: true

      - name: Package application
        run: |
          cmake --install build --prefix /tmp/Protokollitaja

          mkdir -p /tmp/Protokollitaja/Data

          # Look for Print_template.html in various locations
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} /tmp/Protokollitaja/Data/ 2>/dev/null || true

          cp Release-Notes.md /tmp/Protokollitaja/ 2>/dev/null || true

          cd /tmp/Protokollitaja/bin/
          rm -v !("Protokollitaja"|"Protofinaal"|"Protolehelugeja"|"RangeControl")
          cd -
          ln -s /tmp/Protokollitaja/bin/Protokollitaja /tmp/Protokollitaja/Protokollitaja
          ln -s /tmp/Protokollitaja/bin/Protolehelugeja /tmp/Protokollitaja/Protolehelugeja
          ln -s /tmp/Protokollitaja/bin/Protofinaal /tmp/Protokollitaja/Protofinaal
          ln -s /tmp/Protokollitaja/bin/RangeControl /tmp/Protokollitaja/RangeControl

          echo "Packaged files:"
          ls -la /tmp/Protokollitaja/
          echo "Libraries:"
          ls -la /tmp/Protokollitaja/lib/ | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-Linux
          path: /tmp/Protokollitaja
          retention-days: 30

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "mac"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_EXE_LINKER_FLAGS="-liconv" \
            -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          echo "Looking for test executables..."
          find . -name "*test*" -type f \( -perm +111 -o -executable \) || true
          echo "Running CTest..."
          ctest --output-on-failure -C Release --verbose || echo "No tests found or tests failed"
        continue-on-error: true

      - name: Package application
        run: |
          mkdir -p build/Protokollitaja-macOS
          mkdir -p build/Protokollitaja-macOS/Data

          # # Find and copy .app bundles or executables
          # find build -type f \( -name "Protokollitaja" -o -name "Protolehelugeja" -o -name "Protofinaal" -o -name "Rangecontrol" \) | \
          #   grep -v test | grep -v CMakeFiles | while read file; do
          #     echo "Copying: $file"
          #     cp "$file" build/Protokollitaja-macOS/ 2>/dev/null || true
          #   done

          # Also look for .app bundles
          find build -type d -name "*.app" | grep -v test | while read app; do
            echo "Copying app bundle: $app"
            cp -R "$app" build/Protokollitaja-macOS/ 2>/dev/null || true
          done

          # Look for Print_template.html
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} build/Protokollitaja-macOS/Data/ 2>/dev/null || true

          cp Release-Notes.md build/Protokollitaja-macOS/ 2>/dev/null || true

          echo "Packaged files:"
          ls -la build/Protokollitaja-macOS/

          cd build/Protokollitaja-macOS
          for app in *.app; do
            if [ -d "$app" ]; then
              echo "Running macdeployqt on: $app"
              macdeployqt "$app" || true
            fi
          done


          cmake --install build --prefix /tmp/Protokollitaja

          mkdir -p /tmp/Protokollitaja/Data

          # Look for Print_template.html in various locations
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} /tmp/Protokollitaja/Data/ 2>/dev/null || true

          cp Release-Notes.md /tmp/Protokollitaja/ 2>/dev/null || true

          echo "Packaged files:"
          ls -la /tmp/Protokollitaja/
          echo "Libraries:"
          ls -la /tmp/Protokollitaja/lib/ | head -20

      - name: Create archive
        run: |
          cd build
          tar -czf ../Protokollitaja-macOS.tar.gz Protokollitaja-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-macOS
          path: |
            Protokollitaja-macOS.tar.gz
            /tmp/Protokollitaja
          retention-days: 30
