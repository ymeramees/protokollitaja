name: Build

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          tools: "tools_mingw90"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "MinGW Makefiles" `
            -DCMAKE_PREFIX_PATH="${env:Qt6_DIR}" `
            -DCMAKE_BUILD_TYPE=Release `
            -S . `
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Package application
        run: |
          New-Item -Path .\build -Name "Protokollitaja-Windows" -ItemType "directory" -Force
          New-Item -Path ".\build\Protokollitaja-Windows" -Name "Data" -ItemType "directory" -Force
          New-Item -Path ".\build\Protokollitaja-Windows" -Name "tools" -ItemType "directory" -Force

          $apps = Get-ChildItem -Path ".\build" -Recurse -Name -Include *.exe -Exclude *test.exe
          foreach($app in $apps) {
            if (Test-Path ".\build\$app") {
              Copy-Item ".\build\$app" -Destination ".\build\Protokollitaja-Windows"
            }
          }

          if (Test-Path ".\protokollitaja\build\release\Data\Print_template.html") {
            Copy-Item ".\protokollitaja\build\release\Data\Print_template.html" -Destination ".\build\Protokollitaja-Windows\Data"
          }

          Copy-Item ".\Release-Notes.md" -Destination ".\build\Protokollitaja-Windows" -ErrorAction SilentlyContinue

          cd .\build\Protokollitaja-Windows
          $copiedApps = Get-ChildItem -Path . -Name -Include *.exe
          foreach($app in $copiedApps) {
            windeployqt $app
          }

      - name: Create archive
        run: |
          Compress-Archive -Path ".\build\Protokollitaja-Windows" -DestinationPath "Protokollitaja-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-Windows
          path: Protokollitaja-Windows.zip
          retention-days: 30

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "linux"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Ninja" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Package application
        run: |
          mkdir -p build/Protokollitaja-Linux
          mkdir -p build/Protokollitaja-Linux/Data

          find build -type f -executable -name "*.exe" -o -name "protokollitaja" -o -name "protolehelugeja" -o -name "protofinaal" -o -name "rangecontrol" | \
            grep -v test | xargs -I {} cp {} build/Protokollitaja-Linux/ 2>/dev/null || true

          if [ -f "protokollitaja/build/release/Data/Print_template.html" ]; then
            cp protokollitaja/build/release/Data/Print_template.html build/Protokollitaja-Linux/Data/
          fi

          cp Release-Notes.md build/Protokollitaja-Linux/ 2>/dev/null || true

      - name: Create archive
        run: |
          cd build
          tar -czf ../Protokollitaja-Linux.tar.gz Protokollitaja-Linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-Linux
          path: Protokollitaja-Linux.tar.gz
          retention-days: 30

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "mac"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Package application
        run: |
          mkdir -p build/Protokollitaja-macOS
          mkdir -p build/Protokollitaja-macOS/Data

          find build -type f -perm +111 \( -name "protokollitaja" -o -name "protolehelugeja" -o -name "protofinaal" -o -name "rangecontrol" \) | \
            grep -v test | xargs -I {} cp {} build/Protokollitaja-macOS/ 2>/dev/null || true

          if [ -f "protokollitaja/build/release/Data/Print_template.html" ]; then
            cp protokollitaja/build/release/Data/Print_template.html build/Protokollitaja-macOS/Data/
          fi

          cp Release-Notes.md build/Protokollitaja-macOS/ 2>/dev/null || true

          cd build/Protokollitaja-macOS
          for app in protokollitaja protolehelugeja protofinaal rangecontrol; do
            if [ -f "$app" ]; then
              macdeployqt "$app" || true
            fi
          done

      - name: Create archive
        run: |
          cd build
          tar -czf ../Protokollitaja-macOS.tar.gz Protokollitaja-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-macOS
          path: Protokollitaja-macOS.tar.gz
          retention-days: 30
