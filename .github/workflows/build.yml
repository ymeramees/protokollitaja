name: Build

on:
  push:
    branches:
      - feature/macos-and-linux-builds
  pull_request:
    branches:
      - feature/macos-and-linux-builds

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          # Find MinGW path from Qt installation
          $mingwPath = Get-ChildItem -Path "$env:Qt6_DIR\..\..\Tools" -Directory -Filter "mingw*" | Select-Object -First 1
          if ($mingwPath) {
            $env:PATH = "$($mingwPath.FullName)\bin;$env:PATH"
            Write-Host "Added MinGW to PATH: $($mingwPath.FullName)\bin"
          }
          cmake -G "MinGW Makefiles" `
            -DCMAKE_PREFIX_PATH="${env:Qt6_DIR}" `
            -DCMAKE_BUILD_TYPE=Release `
            -S . `
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Package application
        run: |
          New-Item -Path .\build -Name "Protokollitaja-Windows" -ItemType "directory" -Force
          New-Item -Path ".\build\Protokollitaja-Windows" -Name "Data" -ItemType "directory" -Force
          New-Item -Path ".\build\Protokollitaja-Windows" -Name "tools" -ItemType "directory" -Force

          $apps = Get-ChildItem -Path ".\build" -Recurse -Name -Include *.exe -Exclude *test.exe
          foreach($app in $apps) {
            if (Test-Path ".\build\$app") {
              Copy-Item ".\build\$app" -Destination ".\build\Protokollitaja-Windows"
            }
          }

          if (Test-Path ".\protokollitaja\build\release\Data\Print_template.html") {
            Copy-Item ".\protokollitaja\build\release\Data\Print_template.html" -Destination ".\build\Protokollitaja-Windows\Data"
          }

          Copy-Item ".\Release-Notes.md" -Destination ".\build\Protokollitaja-Windows" -ErrorAction SilentlyContinue

          cd .\build\Protokollitaja-Windows
          $copiedApps = Get-ChildItem -Path . -Name -Include *.exe
          foreach($app in $copiedApps) {
            windeployqt $app
          }

      - name: Create archive
        run: |
          Compress-Archive -Path ".\build\Protokollitaja-Windows" -DestinationPath "Protokollitaja-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-Windows
          path: Protokollitaja-Windows.zip
          retention-days: 30

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "linux"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Ninja" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          echo "Looking for test executables..."
          find . -name "*test*" -type f -executable || true
          echo "Running CTest..."
          ctest --output-on-failure -C Release --verbose || echo "No tests found or tests failed"
        continue-on-error: true

      - name: Package application
        run: |
          mkdir -p build/Protokollitaja-Linux
          mkdir -p build/Protokollitaja-Linux/Data
          mkdir -p build/Protokollitaja-Linux/lib

          # Find and copy executables from build directories
          find build -type f -executable \( -name "Protokollitaja" -o -name "Protolehelugeja" -o -name "Protofinaal" -o -name "Rangecontrol" \) | \
            grep -v test | grep -v CMakeFiles | while read file; do
              echo "Copying: $file"
              cp "$file" build/Protokollitaja-Linux/ 2>/dev/null || true
            done

          # Copy Qt libraries
          echo "Copying Qt libraries..."
          QT_LIB_DIR="${Qt6_DIR}/../../lib"

          # Copy required Qt libraries
          for lib in libQt6Core libQt6Gui libQt6Widgets libQt6Network libQt6PrintSupport libQt6SerialPort libQt6Sql libQt6DBus libicudata libicui18n libicuuc; do
            find "$QT_LIB_DIR" -name "${lib}.so*" -type f -exec cp {} build/Protokollitaja-Linux/lib/ \; 2>/dev/null || true
          done

          # Copy Qt plugins
          mkdir -p build/Protokollitaja-Linux/plugins
          if [ -d "${Qt6_DIR}/../../plugins" ]; then
            cp -r "${Qt6_DIR}/../../plugins/platforms" build/Protokollitaja-Linux/plugins/ 2>/dev/null || true
            cp -r "${Qt6_DIR}/../../plugins/imageformats" build/Protokollitaja-Linux/plugins/ 2>/dev/null || true
            cp -r "${Qt6_DIR}/../../plugins/sqldrivers" build/Protokollitaja-Linux/plugins/ 2>/dev/null || true
          fi

          # Create wrapper scripts with LD_LIBRARY_PATH
          for exe in build/Protokollitaja-Linux/Protokollitaja build/Protokollitaja-Linux/Protolehelugeja build/Protokollitaja-Linux/Protofinaal build/Protokollitaja-Linux/Rangecontrol; do
            if [ -f "$exe" ]; then
              basename=$(basename "$exe")
              mv "$exe" "${exe}.bin"
              cat > "$exe" << 'EOF'
#!/bin/bash
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
export LD_LIBRARY_PATH="${DIR}/lib:${LD_LIBRARY_PATH}"
export QT_PLUGIN_PATH="${DIR}/plugins"
exec "${DIR}/$(basename "$0").bin" "$@"
EOF
              chmod +x "$exe"
            fi
          done

          # Look for Print_template.html in various locations
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} build/Protokollitaja-Linux/Data/ 2>/dev/null || true

          cp Release-Notes.md build/Protokollitaja-Linux/ 2>/dev/null || true

          echo "Packaged files:"
          ls -la build/Protokollitaja-Linux/
          echo "Libraries:"
          ls -la build/Protokollitaja-Linux/lib/ | head -20
          done

          # Look for Print_template.html in various locations
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} build/Protokollitaja-Linux/Data/ 2>/dev/null || true

          cp Release-Notes.md build/Protokollitaja-Linux/ 2>/dev/null || true

          echo "Packaged files:"
          ls -la build/Protokollitaja-Linux/
          echo "Libraries:"
          ls -la build/Protokollitaja-Linux/lib/ | head -20

      - name: Create archive
        run: |
          cd build
          tar -czf ../Protokollitaja-Linux.tar.gz Protokollitaja-Linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-Linux
          path: Protokollitaja-Linux.tar.gz
          retention-days: 30

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "mac"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_EXE_LINKER_FLAGS="-liconv" \
            -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          echo "Looking for test executables..."
          find . -name "*test*" -type f \( -perm +111 -o -executable \) || true
          echo "Running CTest..."
          ctest --output-on-failure -C Release --verbose || echo "No tests found or tests failed"
        continue-on-error: true

      - name: Package application
        run: |
          mkdir -p build/Protokollitaja-macOS
          mkdir -p build/Protokollitaja-macOS/Data

          # Find and copy .app bundles or executables
          find build -type f \( -name "Protokollitaja" -o -name "Protolehelugeja" -o -name "Protofinaal" -o -name "Rangecontrol" \) | \
            grep -v test | grep -v CMakeFiles | while read file; do
              echo "Copying: $file"
              cp "$file" build/Protokollitaja-macOS/ 2>/dev/null || true
            done

          # Also look for .app bundles
          find build -type d -name "*.app" | grep -v test | while read app; do
            echo "Copying app bundle: $app"
            cp -R "$app" build/Protokollitaja-macOS/ 2>/dev/null || true
          done

          # Look for Print_template.html
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} build/Protokollitaja-macOS/Data/ 2>/dev/null || true

          cp Release-Notes.md build/Protokollitaja-macOS/ 2>/dev/null || true

          echo "Packaged files:"
          ls -la build/Protokollitaja-macOS/

          cd build/Protokollitaja-macOS
          for app in *.app; do
            if [ -d "$app" ]; then
              echo "Running macdeployqt on: $app"
              macdeployqt "$app" || true
            fi
          done

      - name: Create archive
        run: |
          cd build
          tar -czf ../Protokollitaja-macOS.tar.gz Protokollitaja-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-macOS
          path: Protokollitaja-macOS.tar.gz
          retention-days: 30
