  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from version.h
        id: version
        run: |
          VERSION=$(grep 'VER_FILEVERSION_STR' common/src/version.h | grep -oP '"\K[^"]*' | head -1)
          echo "version=${VERSION%\\0}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "linux"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Ninja" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          echo "Looking for test executables..."
          find . -name "*est*" -type f -executable || true
          echo "Running CTest..."
          ctest --output-on-failure -C Release --verbose || echo "No tests found or tests failed"
        continue-on-error: true

      - name: Package application
        run: |
          cmake --install build --prefix /tmp/Protokollitaja

          mkdir -p /tmp/Protokollitaja/Data

          # Look for Print_template.html in various locations
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} /tmp/Protokollitaja/Data/ 2>/dev/null || true

          cp Release-Notes.md /tmp/Protokollitaja/ 2>/dev/null || true

          cd /tmp/Protokollitaja/bin/
          shopt -s extglob
          rm -v !("Protokollitaja"|"Protofinaal"|"Protolehelugeja"|"RangeControl")
          cd -
          # ln -s /tmp/Protokollitaja/bin/Protokollitaja /tmp/Protokollitaja/Protokollitaja
          # ln -s /tmp/Protokollitaja/bin/Protolehelugeja /tmp/Protokollitaja/Protolehelugeja
          # ln -s /tmp/Protokollitaja/bin/Protofinaal /tmp/Protokollitaja/Protofinaal
          # ln -s /tmp/Protokollitaja/bin/RangeControl /tmp/Protokollitaja/RangeControl

          echo "Packaged files:"
          ls -la /tmp/Protokollitaja/
          echo "Libraries:"
          ls -la /tmp/Protokollitaja/lib/ | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-${{ steps.version.outputs.version }}-Linux-dev-${{ github.run_number }}
          path: /tmp/Protokollitaja
          retention-days: 30

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from version.h
        id: version
        run: |
          VERSION=$(grep 'VER_FILEVERSION_STR' common/src/version.h | grep -oP '"\K[^"]*' | head -1)
          echo "version=${VERSION%\\0}" >> $GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: "mac"
          target: "desktop"
          modules: "qtserialport qt5compat"
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_EXE_LINKER_FLAGS="-liconv" \
            -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          echo "Looking for test executables..."
          find . -name "*test*" -type f \( -perm +111 -o -executable \) || true
          echo "Running CTest..."
          ctest --output-on-failure -C Release --verbose || echo "No tests found or tests failed"
        continue-on-error: true

      - name: Package application
        run: |
          mkdir -p build/Protokollitaja-macOS
          mkdir -p build/Protokollitaja-macOS/Data

          # # Find and copy .app bundles or executables
          # find build -type f \( -name "Protokollitaja" -o -name "Protolehelugeja" -o -name "Protofinaal" -o -name "Rangecontrol" \) | \
          #   grep -v test | grep -v CMakeFiles | while read file; do
          #     echo "Copying: $file"
          #     cp "$file" build/Protokollitaja-macOS/ 2>/dev/null || true
          #   done

          # Also look for .app bundles
          find build -type d -name "*.app" | grep -v test | while read app; do
            echo "Copying app bundle: $app"
            cp -R "$app" build/Protokollitaja-macOS/ 2>/dev/null || true
          done

          # Look for Print_template.html
          find . -name "Print_template.html" -type f | head -n 1 | xargs -I {} cp {} build/Protokollitaja-macOS/Data/ 2>/dev/null || true

          cp Release-Notes.md build/Protokollitaja-macOS/ 2>/dev/null || true

          echo "Packaged files:"
          ls -la build/Protokollitaja-macOS/

          cd build/Protokollitaja-macOS
          for app in *.app; do
            if [ -d "$app" ]; then
              echo "Running macdeployqt on: $app"
              macdeployqt "$app" || true
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokollitaja-macOS-${{ steps.version.outputs.version }}-dev-${{ github.run_number }}
          path: build/Protokollitaja-macOS
          retention-days: 30
